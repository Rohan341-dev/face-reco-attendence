services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: facetrack
      POSTGRES_USER: facetrack
      POSTGRES_PASSWORD: facetrack
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facetrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
